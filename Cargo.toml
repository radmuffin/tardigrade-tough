[package]
name = "tardigrade-tough"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
fly_common = { path = "../fly-common", features = ["ws", "sync", "qr", "db", "auth", "server", "security"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
